[project]
name = "riskly-backend"
version = "0.1.0"
description = "FastAPI backend for Riskly"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "aiohttp>=3.9",
    "apscheduler>=3.10",
    "itsdangerous>=2.2",
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "joblib>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
